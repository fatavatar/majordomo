# mudengine configuration
#
# This file is watched. Save it and the running client picks the change up
# within about half a second — no restart, no reconnect. If a save leaves the
# file unparseable the client keeps the last good values and prints the parse
# error into the terminal, so a typo mid-edit is harmless.
#
# Every key is optional. Anything omitted, misspelled or out of range falls
# back to the built-in default rather than failing the load.
#
# Copied to <userData>/global/default.yaml on first run. Edit that copy; this
# file is the reference -- and any block added to it later is copied across on
# the next launch, comments and all, so a setting added to the client never
# ends up invisible in a file that predates it.
#
# Two kinds of thing live here, and the settings screen shows them as two
# pages:
#
#   MudEngine   the client itself -- the console, the theme, the tabs, the
#               records it keeps. `terminal:`, `ui:`, `logging:`.
#   Global      what a NEW realm or character starts with. `connection:`,
#               `automation:`, `ui.alerts`.
#
# Nothing under Global is live for anything that already exists: a realm or a
# character takes a copy when it is made and keeps its own from then on.

# What a NEW REALM starts with, and where the client connects before you have
# made a character at all.
#
# A realm made from the settings screen takes a copy of these -- the port, the
# encoding and the menu script below -- into its own file under `servers/`, and
# owns them from then on. Changing them here changes what the next realm starts
# with; it does not reach back into the ones you already have.
connection:
  # Paradigm, which is what this client ships for: `servers/` is seeded with
  # its six realms on first run and Paradigm's world is one of the two the
  # client bundles. A realm you add on the Realms page starts from these and
  # then owns its own copy.
  host: paramud.mudinfo.net
  port: 2323

  # cp437 | utf8 | latin1
  #
  # Chosen once per realm and then never touched again. The session card
  # reports what is in force.
  #
  # cp437 is correct and the other two are here for derivatives that have
  # genuinely moved on. MajorMUD-family servers emit raw high bytes for the
  # box-drawing and block glyphs their banners are built from: a MajorMUD-family
  # server opens with b0 db db b1 (CP437 ░ █ █ ▒), which is not valid UTF-8 and
  # decodes to gibberish as Latin-1. Change this only if you know your server
  # was rebuilt to speak something else.
  encoding: cp437

  # Automatic login: the menus on the way in. The account itself -- username,
  # password, and whether to connect on launch -- belongs to a character, in
  # `profiles/<id>/profile.yaml`; the client never connects without one, so
  # nothing here holds a credential. Each character's file is local to your
  # machine and gitignored: never put real credentials in `default.yaml`, which
  # is committed.
  #
  # Safety, so an automated login cannot misbehave against a live service:
  #   - a rejected password is never retried
  #   - a prompt that comes back a second time stops the sequence
  #   - a missing answer leaves the prompt for you
  #   - login is skipped unless the character has both a username and a password
  login:
    # The menus on the way in, as "when the server says this, send that".
    #
    # Matched anywhere in the line and case-insensitively, each row used once,
    # and in whatever order the menus actually arrive -- a realm with one
    # character skips the character menu, and a script that insisted on its own
    # order would stall there. Enter is always sent, so `send: ''` is a bare
    # Enter, which several menus want.
    #
    # `repeat: true` answers a row every time its prompt arrives instead of
    # once. It is for a *pager* -- `(N)onstop, (Q)uit, or (C)ontinue?` -- which
    # a BBS asks once per screenful, so it comes back precisely because the
    # answer worked. A menu is the other kind and stays once-only: one that
    # comes back means the answer was refused, and answering again loops. A row
    # that sends `{user}` or `{password}` ignores the flag; the account goes out
    # once per connection whatever the script says, which is what stops an
    # automated client retrying a password into a lockout.
    #
    # This replaced four named keys -- selection, realm, character, enterRealm.
    # Those were *Paradigm's* menus, and naming them made one realm's layout
    # part of the client's vocabulary; MajorMUD behind WorldGroup can put any
    # number of menus and any amount of ANSI in between.
    #
    # `{user}` and `{password}` send the character's own, so the two account
    # prompts are rows here like every other. They used to be answered from the
    # client's own vocabulary instead, which recognised one wording of each --
    # a realm that asks `Enter your ID:` got no answer and no way to say so.
    # The values are still never written here: they come from the character's
    # file. `{username}` and `{pass}` mean the same two things.
    #
    # The rows below are what Paradigm asks for. A realm you add on the Realms
    # page carries its own `login:` list, which is the better place for it:
    # every character on one realm meets the same menus.
    steps:
      - when: 'Please enter your username'
        send: '{user}'
      - when: 'Please enter your password'
        send: '{password}'
      - when: 'Please enter your selection'
        send: P
      - when: 'Please select a realm'
        send: '1'
      - when: 'Please select a character'
        send: '1'
      - when: '[PARADIGM]'
        send: E
      # A menu the server added later (a rules gate, in this case) gets a row
      # the same way; one nobody has configured is left alone silently.
      - when: Accept these realm rules to continue
        send: '1'
      # The pager, which is asked once per screenful: without `repeat` the
      # first one is answered, the text that follows fills another screen, and
      # the login sits at the second prompt for ever.
      - when: '(N)onstop, (Q)uit, or (C)ontinue?'
        send: ''
        repeat: true

# Realms -- the servers you connect to -- are files: one directory each.
#
#   servers/<id>/server.yaml    host, port, encoding, and the realm's menus
#   servers/<id>/loops/*.yaml   loops every character playing there may walk
#
# A realm moved out of this file when it acquired two things a list inside a
# global file cannot hold: a login script, which is the largest thing about a
# realm and the least like a setting, and loops, which belong to a *place*
# rather than to whoever is walking them. The directory's name is an id -- a
# filename -- and the name a player reads is inside the file, so renaming a
# realm does not strand its loops.
#
# The realm's `database:` key is there too -- the world every character
# playing there walks. Empty follows what the realm calls itself at its menu,
# MajorMUD or Paradigm, both of which ship with the client, so none of the six
# shipped realms names one; `majormud` or `paradigm` pins one. A realm whose
# data differs from both names its own .mdb, .accdb, .sqlite or .db -- or a
# .zip holding one -- which is converted ONCE into the same normalised
# form and cached in `realms/`, never queried while you are playing. It used to
# be stated per character, which was the same answer written out once per
# character on that realm and as many places for it to drift.
#
# The settings screen writes them, and `resources/servers/` ships Paradigm's
# six -- four game realms on port 2323 and two test realms on 2324, differing
# only in the realm number their `login:` script answers with. There is
# deliberately no `servers:` key here any more: two places to state the same
# realm is one the screen can edit and one nobody can find.

# Characters live in `profiles/`, one directory each -- `profiles/<id>/
# profile.yaml`, with `profiles/<id>/loops/` beside it for the loops only that
# character may walk. The id is the directory's name and it names the session,
# the log, the capture and the tab. See `profile.default.yaml` for an annotated
# one to copy. The tree is watched the same way this file is.

terminal:
  font:
    # Preference-ordered. The first family present on the system wins, and any
    # glyph it is missing falls through to the next.
    #
    # A cross-platform monospace ladder is appended automatically — Lucida
    # Console, Consolas, Menlo, Monaco, DejaVu Sans Mono, Liberation Mono,
    # Courier New — followed by the bundled CP437 face and the generic
    # `monospace` keyword. You cannot end up with a proportional console; the
    # game's maps, frames and stat columns are laid out in character cells and
    # a variable-pitch face shears every one of them.
    family:
      - LucidaProgrammer Nerd Font Mono
    size: 16

  # Lines kept in the backscroll: what the console can scroll back through,
  # and how much of it is written down per character and read back at the
  # next launch, so quitting empties nothing. 0 keeps none and writes none.
  scrollback: 100000

  cursorBlink: true
  # block | underline | bar
  cursorStyle: block

ui:
  font:
    # The chrome around the terminal. Monospace by default so the whole client
    # reads as one instrument; this is the one surface where a proportional
    # stack is allowed if you prefer it.
    family:
      - LucidaProgrammer Nerd Font Mono
    size: 13

  # auto | comfortable | compact
  # `auto` follows the viewport. Never the terminal grid, which NAWS depends on.
  density: auto

  # Where the character tabs sit when more than one character is loaded:
  # top | left | right. They are not one control at three angles.
  #
  # `left` costs horizontal space, which is the expensive axis -- the console
  # needs 80 columns and no MajorMUD-family server will format to less -- but it
  # buys room for each character's health in numbers, the room they are in and
  # what they are doing. That is the multiboxing instrument: the reason to look
  # at a second character is almost never to read its scrollback.
  #
  # `top` costs rows, which are cheap, and collapses each tab to a name, a state
  # dot and a health bar.
  #
  # `right` is `left` mirrored, and the mirror takes the card rail with it: the
  # tabs move to the right edge and the cards to the left. It costs exactly what
  # `left` costs. Which side each rail is on is your hand and your monitor, not
  # a trade -- so it is one setting and not two, because the two rails cannot
  # both have the same edge.
  #
  # `left` is the default: this is a client for playing several characters, and
  # the roomier rail is the one that earns its space the moment there is more
  # than one of them.
  tabs: left

  # dark | light | system
  #
  # `system` follows the OS appearance and repaints live when it changes.
  # A theme sets the chrome palette and the terminal's 16 ANSI colours
  # together; it never changes layout, spacing or the character grid. New
  # themes are registered in src/shared/themes.ts and become selectable here
  # automatically.
  #
  # Cycle without editing this file: Ctrl/Cmd+Shift+T, or "Cycle theme" in the
  # command palette. That choice is remembered and outranks this setting until
  # you clear it.
  theme: dark

  # How the cards are laid out: what each one puts where, and how it shows it.
  # The theme above says what everything is painted; any skin wears any theme.
  #
  # classic  the cards as they have always been drawn, in ui.font.
  # glance   colour and shape carry what rows of words did: figures inside
  #          their bars, a player's alignment as the colour of the name, lines
  #          that say the same thing folded into one with a count. Shorter
  #          cards, read at a glance, in JetBrains Mono.
  # atlas    glance's cards as soft panels in Victor Mono, places named in its
  #          cursive italic like labels on a map, the ways out as a compass
  #          rose and a loop as a ring.
  # halo     glance's cards as a contemporary app in Geist Mono: rounded cards
  #          tinted by kind, the vitals and attributes as rings, people and
  #          monsters as initials in their colour, notices as a timeline.
  #
  # Every style but classic sets its own monospace face for the whole window,
  # in place of ui.font; the console keeps terminal.font in all of them.
  skin: classic

  # Where the HUD meters turn yellow and then red.
  #
  # Fractions of maximum, not points, so a threshold means the same thing at
  # every level: 25% is seven HP at level one and seven hundred at level fifty,
  # and both are the same amount of trouble. (Written as a percentage — `25`
  # instead of `0.25` — it is read as one, so neither spelling misfires.)
  #
  # Health and mana are separate because they are different decisions: low
  # health is about whether to run, low mana is about whether to cast.
  #
  # Until the stat sheet has been seen there is no maximum to compare against,
  # and the meter stays hatched rather than picking a colour — unknown is not
  # zero.
  vitals:
    hp:
      caution: 0.5
      critical: 0.25
    mana:
      caution: 0.5
      critical: 0.25

  # What reaches the Alerts card.
  #
  # An alert is for something you would want to act on and could not go back and
  # find. The terminal already carries every line, so the card deliberately
  # carries very little: a fight that cannot be won, a command the server said
  # out loud, a vital crossing a threshold, a player attacking you. Which line
  # is a warning and which is the record is decided in the client, from what the
  # fact costs; these two settings decide who hears about it. Critical is for
  # four alone: hung up, the link dropped, ran and fled -- the character out
  # of the realm or out of a fight -- and they are the only alerts that light a
  # character's tab.
  alerts:
    # Your own alerts, tried in order, and the ONLY thing that decides.
    #
    # The FIRST row that matches a notice decides it -- whether it is shown, how
    # loud it is, and whether it also raises a desktop notification -- so a
    # specific row above a blanket one is a thing you can write. Anything no row
    # matches is still shown, at the level the client gave it: this is not an
    # allow list, so a channel the client gains later arrives visible, and a
    # list you have emptied shows what the client would have shown you anyway.
    #
    # A severity floor and a per-channel mute list stood beside these rows until
    # 2026-09-12. Every question they answered is a row -- "never tell me about
    # movement" is a row with `alert: false`, "only the loud ones" is a row
    # naming a level, "tell me when a gold ring is found" is an `item` row -- so
    # they were a second way of asking one question and are gone. Your own
    # settings were carried into rows when the client first ran after that.
    #
    # `on` names an EVENT -- one thing that happens in the realm. It used to
    # name one of eleven channels (combat, room, session...), which are the
    # buckets this client sorts notices into rather than things that happen:
    # a row saying `combat` meant every monster's blow, every refused spell and
    # your own death together. Your old rows were carried to the nearest
    # happening when the client first ran after 2026-09-13, and it said so.
    #
    # The settings screen lists every event, grouped, in plain English. Five of
    # them take something more than the event itself:
    #
    #   health, mana        a figure you choose, in the direction you choose
    #                       (`side`, `value`, `percent`); fired on the CROSSING,
    #                       not on the value, so standing at 20% does not alert
    #                       once a second.
    #   item-found          matched by `name`, catching the thing lying in the
    #   player-seen         room and the thing a search turned up.
    #   cash-found          a pile a search turned up, `value` in COPPER --
    #                       which is what this client normalises every purse and
    #                       every quoted price into, so one number covers every
    #                       coin the realm prints. One-sided: there is no
    #                       maximum to be a share of.
    #
    # `level` empty keeps what the client decided (what a line costs is a fact
    # about the realm); name a severity to overrule it for this row alone.
    #
    # `alert` and `notify` are the two readings. `alert` puts the line on the
    # Alerts card, for somebody watching it. `notify` raises it OUTSIDE the
    # window, where the system shows it -- which is most of an evening, because
    # automating a character is what lets you go and do something else; clicking
    # one brings the window forward and shows that character. `whileFocused`
    # raises it while this window is in front as well, and means nothing without
    # `notify`, so it is stored off there.
    #
    # Two switches under `desktop:` decided both of those for everything until
    # 2026-09-13. Every question they answered is one of the two keys above, and
    # your settings were carried onto your rows when the client first ran after
    # it. One notification per character at a time, the newest, and each kind
    # then rests a minute before it speaks again about that character -- being
    # attacked is a fresh line several times a round.
    #
    # `quietSeconds` is how long the row stays quiet after it fires -- 30 by
    # default. The case is an event the realm repeats, a refused attack every
    # round or a search in a dead end, where the first is the whole of the news.
    # 0 means every occurrence. It is per ROW, so two rows on one event at two
    # figures keep separate clocks.
    #
    # These four are what a fresh client ships with. Every one is removable, and
    # a list with nothing in it is not silence -- it is the client's own ranking.
    rules:
      - 'on': health
        side: below
        value: 35
        percent: true
        level: warning
        alert: true
        notify: true
        whileFocused: false
        quietSeconds: 30
      - 'on': mana
        side: below
        value: 20
        percent: true
        level: warning
        alert: true
        notify: false
        whileFocused: false
        quietSeconds: 30
      - 'on': attacked
        level: warning
        alert: true
        notify: true
        whileFocused: true
        quietSeconds: 30
      - 'on': arrived
        alert: true
        notify: true
        whileFocused: false
        quietSeconds: 30

  # Show the HUD rail beside the console.
  #
  # The HUD is what you read while playing, and it appears on its own without
  # opening a panel named after something else. Toggle it from the command
  # palette without editing this.
  #
  # The rail keeps its space when a character is not in the realm and says so,
  # rather than vanishing -- a blank column beside a live one reads as damage,
  # and a rail that comes and goes changes the console's width, which re-wraps
  # a scrollback nobody asked to re-wrap.
  #
  # Which cards are on it, in what order, which are floated over the console and
  # how far through each of those you can see is not configured here: it is
  # arranged by dragging, and remembered per character. "Reset this character's
  # cards" in the command palette puts it back.
  showHud: true

  # The console's own ground, when the client's is not the one it wants.
  #
  # A light theme is a fine thing to want for the chrome -- a rail of cards, a
  # settings form and a table all read well on paper. The console is not that:
  # what it shows is forty years of ANSI art drawn against black, and a light
  # palette has to make colour 0 BE the paper, so every `ESC[30m` the realm
  # sends comes back as the page.
  #
  # keepDark is whether the console parts company with the chrome, and it only
  # applies under a LIGHT theme -- under a dark one there is nothing to part
  # from. darkTheme is which dark palette it wears when it does, and naming a
  # light theme here is coerced back to `dark`: it is a contradiction rather
  # than a preference. Any dark theme id from the palette's list will do.
  console:
    # Which sixteen the console paints the realm's colour codes with.
    #
    # `theme` is the default and means the console wears the palette of
    # whatever theme it is on, keepDark below included -- that is the client as
    # it has always looked. Name one of the seven instead and it wins over both
    # keys below, because a palette you picked outranks a rule about what to do
    # when you picked nothing.
    #
    # Dark:  vivid-vga, neon-night, aurora-ice, ember-forge
    # Light: paper-ink, parchment, daylight-neon
    #
    # vivid-vga is the IBM set the client ships with, with the dim ramp lifted
    # off the ground -- same hues, but `blue` is a colour you can read instead
    # of one that hides in the black.
    palette: theme
    keepDark: true
    darkTheme: dark

  # The client's own mark, at the left of the status rail.
  #
  # On by default: it is the one place the client says what it is, and a brand
  # nobody ever sees is the same as none. Turn it off if you would rather the
  # status rail held nothing but facts about the session -- it is not in the way
  # of anything either way, since it takes the height that line already has.
  showLogo: true

  # What the console draws in place of what the realm printed: a list of
  # designs, each naming what it redraws -- the prompt row, the pack, the
  # roster, a shop's shelf, the party, the experience line -- and the template
  # it is drawn by, with what the client knows laid beside the realm's words:
  # an item's weight and figures, whether you may wear it, what a price comes
  # to against your purse. Presentation only, and every one is off until you
  # turn it on. The first design that is on for an entity is the one that
  # draws it. The Rewrites section in settings keeps the list, and each
  # design opens in an editor that lists every figure it may name and shows
  # the listing as it will be drawn.
  #
  # A template is text with tags in braces, one line of the template per
  # line of the console. A figure: {hp}, {item}, {me.level}; with a filter
  # after it, {keys|or:none} {name|upper} {weight|right} {title|width:12}.
  # Colours: {red}, {brightBlue} and the other fourteen the console's palette
  # names, {#ff8800}, and {bg:blue} for the ground; {bold}, {dim}, {reset};
  # and a closer -- {/red}, {/colour}, {/bg}, {/bold}, {/dim} -- puts back
  # what was in effect before. Controls: {if hp/hpMax < .5}...{else if
  # need == 0}...{else}...{/if}; {for item in items}...{/for} draws the middle
  # once per row, with every figure of the row reachable through the name it
  # binds ({item.weight}) and {n}, {rows}, {first} and {last} beside it; {table}...{/table} lines every figure inside up in columns,
  # numbers flush right, and {table header} names the columns on a first
  # row. A line holding only controls takes no row. Anything else, emoji
  # included, is drawn as typed. A figure the wire should have stated is
  # drawn as `?`, never as 0; one the realm data lacks is drawn blank.
  #
  # Every design may name the character's own figures: at the top of the
  # prompt row's template ({hp} {hpMax} {mana} {manaMax} {exp} {need}
  # {wealth} {wealthLong} {state} {resting} {meditating} {level} {room}
  # {lives} {expSession} {name} {fullName} {race} {class} {manaType}
  # {encumbrance} {encumbranceMax} {encumbranceWord}), and under `me.` in
  # every other ({me.hp}, {me.level}). The prompt row holds 79 cells; a wider
  # line is refused, out loud, and the realm's own is drawn.
  rewrites:
    # {hp} and {mana} wear a colour by their share of maximum, on every line
    # the client draws: from `atLeast` up the figure wears `colour`, highest
    # floor first. An unknown maximum wears no colour. A party member's
    # {health} and {mana} are percentages and wear the same bands.
    bands:
      hp:
        - { atLeast: 0.75, colour: brightGreen }
        - { atLeast: 0.45, colour: yellow }
        - { atLeast: 0, colour: brightRed }
      mana:
        - { atLeast: 0.5, colour: brightCyan }
        - { atLeast: 0.25, colour: yellow }
        - { atLeast: 0, colour: brightRed }

    # The designs, in order. `entity` is what a design draws in place of:
    #
    #   statline    The prompt row. The client reads the figures off every
    #               prompt and draws this instead, at the moment the prompt
    #               arrives -- so what was drawn stays drawn in the scrollback.
    #               One line; the figures come from the template
    #               `automation.statline` sends.
    # A list is walked with `{for <row> in <list>}`, and every figure of a row
    # is addressed through the name it binds: `{for item in items}` and then
    # `{item.weight}`. The settings screen's designer lists every one of them
    # under a heading of its own, which is where to read this rather than here.
    #
    #   inventory   The pack, in place of `You are carrying ...`, `You have
    #               ... keys`, `Wealth:` and `Encumbrance:`. {items} is one row
    #               per carried thing: {item} {item.name} {item.count}
    #               {item.slot} {item.equipped} {item.worn} {item.wearable}
    #               {item.reason} {item.price} {item.charges}, what can be done
    #               with it ({item.action.toggleEquip} {item.action.drop}) and
    #               the realm's {item.weight} {item.ac} {item.dr} {item.min}
    #               {item.max} {item.damage} {item.stats} {item.kind}
    #               {item.realmSlot} {item.speed} {item.strength}
    #               {item.accuracy} {item.weaponType} {item.hands}
    #               {item.material} {item.uses} {item.minLevel} {item.limit}
    #               {item.gettable} {item.droppable} {item.id} {item.number}
    #               {item.effects} {item.effectsUnread} {item.shops}
    #               {item.droppedBy} {item.icon}. {item.icon} is the slot's
    #               picture over two cells; each action is a control over two,
    #               equipping, removing or putting down with a click and saying
    #               on hover why it cannot. {item.effects} is what the realm
    #               says the thing does -- walk it with `{for effect in
    #               item.effects}` for {effect.name} and {effect.value}, which
    #               is where an alignment or class restriction appears, since
    #               the realm states those as effects and not as columns. Then
    #               {itemCount}, {keys} {keyCount}, {wealth} {wealthLong}
    #               {runic} {platinum} {gold} {silver} {copper},
    #               {encumbrance} {encumbranceMax} {encumbranceWord}
    #               {encumbrancePercent}.
    #   who         The roster `who` prints: {players} is one row per
    #               adventurer -- {player.name} {player.title}
    #               {player.alignment} {player.gang} {player.flags} -- and
    #               {count}.
    #   shop        A shop's shelf, in place of `list`: {items} is one row per
    #               thing sold -- {item} {item.quantity} {item.price} as the
    #               counter said it, {item.priceLong} the same on the coin
    #               ladder (5 runic, 3 gold), {item.cost} in copper, {item.afford}
    #               (`short` when it is more than the purse holds) {item.short}
    #               {item.usable} (the reason this character may not wear it)
    #               {item.wearable} {item.note} {item.basePrice} and the
    #               realm's figures as in the pack -- and {count}.
    #   party       The party listing: {members} is one row per member --
    #               {member.name} {member.class} {member.health} {member.mana}
    #               {member.rank} {member.flag} {member.state} {member.invited}
    #               {member.resting} {member.meditating} -- and {count}.
    #   experience  `You gain N experience.`, one line: {gained}, and beside
    #               it what the client tracks -- {exp} after the gain, {need}
    #               still to {nextLevel}, {level}, {expSession}.
    designs:
      - name: Status line
        entity: statline
        enabled: false
        template: '{bold}{brightWhite}HP {hp}/{hpMax}{reset} {brightWhite}MA {mana}/{manaMax}{reset} Exp {exp} Need {need} ${wealth}{state}> '
      - name: Pack
        entity: inventory
        enabled: false
        template: |
          {table header}
          {for item in items}
          {item.action.toggleEquip} {bold}{item}{/bold}  {dim}{item.weight}{/dim}  {item.stats}  {brightGreen}{item.equipped}{/brightGreen} {item.icon}
          {/for}
          {/table}
          {dim}Keys:{/dim} {keys|or:none}
          {dim}Wealth:{/dim} {brightYellow}{wealthLong}{/brightYellow}  ({wealth} copper)
          {dim}Load:{/dim} {encumbrance}/{encumbranceMax} {encumbranceWord}
      - name: Roster
        entity: who
        enabled: false
        template: |
          {bold}{count} adventurers{/bold}
          {table header}
          {for player in players}
          {player.alignment}  {bold}{player.name}{/bold}  {player.title}  {dim}{player.gang}{/dim}  {player.flags}
          {/for}
          {/table}
      - name: Shop shelf
        entity: shop
        enabled: false
        template: |
          {table header}
          {for item in items}
          {bold}{item}{/bold}  {dim}x{item.quantity}{/dim}  {item.priceLong}  {item.afford}  {item.usable}  {item.icon}
          {/for}
          {/table}
      - name: Party
        entity: party
        enabled: false
        template: |
          {table header}
          {for member in members}
          {member.rank}  {bold}{member.name}{/bold}  {dim}{member.class}{/dim}  {member.health}%  {member.mana}%  {member.state}
          {/for}
          {/table}
      - name: Experience
        entity: experience
        enabled: false
        template: '{brightYellow}+{gained} exp{/brightYellow}  {exp} total, {need} to level {nextLevel}, {expSession} this session'
  # The diagnostics cards -- Session, Link, Traffic and Stream -- are not
  # configured here on purpose. They are a tool you reach for when something
  # looks wrong on the wire, not part of how the client is arranged: "Show
  # diagnostics" in the command palette shows them for as long as this window
  # is open, and the next launch starts with them hidden again.

automation:
  # With this off, only what you type is ever sent, bar the keep-alive (idle,
  # below): that keeps the connection open rather than acting for you.
  enabled: true

  # Walking a planned route -- "Route to room" in the command palette, then
  # "Walk it". Steps go one at a time and each is confirmed against the room the
  # realm data predicted, so a shut door stops the walk instead of
  # desynchronising it.
  #
  # This is client-side patience only, and it is spent twice per step: once
  # waiting for the arbiter to put the command on the wire at all, and again
  # waiting for the realm to answer it. Between the two the walk sends one bare
  # Enter to force a status line (`tuning.walk.nudgeAfterMs` in internal.yaml),
  # so the worst case before a step is given up on is roughly twice this figure
  # plus that beat. It is not a pacing figure -- pacing comes from the prompt,
  # below.
  walk:

    # How long a finished walk stays on screen before the card clears itself.
    # A walk that has arrived is news for a moment and clutter after it, and the
    # card sits above the rest of the rail -- leaving it there moves everything
    # below it for as long as it stays.
    #
    # 0 keeps it until something else happens, if you would rather dismiss it
    # yourself.
    clearAfterSeconds: 15

    # Experience per hour below which a running loop is stopped -- MegaMUD's
    # MinExpRate with LogoffLowExp, both off in its own defaults and off here
    # (0). A lap that has stopped working -- the lair empty tonight, a door
    # shut, a monster that no longer dies -- looks exactly like one that is
    # working for as long as nobody is watching, which unattended is all night.
    # Measured over the lap since it started (or resumed, or came back online)
    # and judged only after `tuning.loop.expRateGraceMs` in internal.yaml, so
    # the walk out of town is not the measurement. Stopped out loud with both
    # figures; the tab reads `stopped`. MegaMUD logs off instead, which this
    # client does not do on its own.
    minExpPerHour: 0

  # Away from keyboard -- MegaMUD's AutoAfk, AfkTimeout and AfkReply.
  #
  # The whole point of an unattended character is that nobody is there, and
  # the one thing the realm's other players cannot see is that. A telepath to
  # a character that never answers reads as rude, or as a bot to report; a
  # reply saying you are away is what a person would leave. Once nothing has
  # been typed into this character for `afterMinutes`, an incoming telepath is
  # answered with `reply` -- once per sender every ten minutes
  # (`tuning.afk.replyEveryMs`), never for an `@` command, which `remotes:`
  # answers instead. Off by default where MegaMUD's is on: telepathing
  # strangers unasked is something to opt into. The reply is MegaMUD's own
  # frame, which other MegaMUD clients recognise; say anything you like.
  afk:
    enabled: false
    afterMinutes: 5
    reply: '{AFK}'

  # What a planned route is allowed to do on the way -- MegaMUD's Movement.
  #
  # `walk:` above is the *timing* of a route and belongs to the walker; these
  # are the two decisions it has to make while walking one.
  movement:
    # Forcing a barrier `open` cannot get past.
    #
    # `The door is locked.` is where opening stops: it answers the same way
    # every time, so every further `open` is a command spent to be told what
    # you already know. There are two ways past a lock and the realm records
    # what each one has to beat -- `Door [41 picklocks/strength]` takes either
    # skill, `Key: 2126 [or 157 picklocks]` takes only the lock-pick.
    #
    # Picking is tried first when both are on, because a pick that fails costs
    # a command and a bash that fails costs a command *and* health -- and the
    # game prints the damage in the room. A picked door is unlocked and still
    # shut, so the client opens it afterwards; a bashed one is open already.
    #
    # Picking is off by default: it is made with a skill the client cannot
    # check the character has. Since the MegaMUD engine, these are what
    # Settings -> MegaMUD carries to its Movement tab when a character starts
    # its MegaMUD settings from this file.
    pickLocks: false
    pickTries: 3
    bashTries: 3

    # Sneak before starting a route.
    #
    # What decides whether the things in the next room notice you arrive, which
    # is the whole difference between a route through a lair and a route through
    # town. Off by default, because sneaking fails: a character that believes it
    # is hidden and is not walks in in plain sight, which is why the client
    # tracks three states -- sneaking, seen, and nobody has said.
    sneak: false

    # Light, before the dark -- MegaMUD's AutoLight.
    #
    # `provideLight` readies a carried light -- a torch, a lantern, a glowing
    # pearl, anything the realm files as a light -- before a step into a room
    # the character could not otherwise read, and on arriving in one. ON BY
    # DEFAULT, the one automated thing that is: the decision is the server's own
    # arithmetic (the room's level, plus the race's night vision, plus what is
    # worn) and a light is readied only where that sum leaves the room unreadable
    # and the light would fix it. `lightDimRooms` widens that to rooms the server
    # describes anyway (`dimly lit`, `barely visible`).
    provideLight: true
    lightDimRooms: false

    # Ways and places routes keep out of, in the realm's own words: a way whose
    # script phrase says one (`go vortex`), or a room whose name does (the
    # Negative Power Plane). A route you ask for that crosses one is shown
    # beside the way round it, and you choose which to walk. A walk nobody is
    # watching -- a loop's leg, an item errand, a quest run, a hunt -- is
    # planned round them, and refused out loud where there is no way round,
    # unless it starts or ends inside one. Empty keeps out of nothing.
    keepOutOf:
      - vortex
      - Negative Power Plane

    # The key to the door in front of you.
    #
    # A keyed exit with no key and nothing a picklock can do about it is a wall
    # the router plans around -- so there is no step to be refused at and no
    # route to press Walk on, and the only moment the client can do anything
    # about it is while the character is standing in the room. ON BY DEFAULT,
    # for the reason `provideLight` is: the whole of the wrong action is one
    # `get` and the weight of a key, and the whole of refusing is the corridor.
    #
    # Narrow on purpose. It fires only where the realm names the item an exit
    # of this room demands, no listing has shown that item in the pack, and the
    # floor holds a name that can only be that row -- the realm has three
    # `iron key`s, and a door opened on a coin toss is the confidently wrong
    # answer the router refuses everywhere else. One `get` per key per room,
    # said out loud.
    collectKeys: true

  # Keeping the pack stocked -- MegaMUD's Must Have Minimum.
  #
  # Each item names a thing to keep, the count below which the character goes
  # shopping (`min`), the count it buys back up to (`max`), and the shop --
  # by name, with the room it was settled to, because six rooms are called
  # General Store. When the pack runs short the client holds whatever it was
  # doing, walks to the shop, asks the counter what it sells, buys one at a time
  # on the counter's own confirmation, and lets the loop go on from the shop.
  # Per character: state a list in a character's own file, or add items from the
  # Self card or the item panel. This global list is what a character with no
  # list of its own inherits.
  #
  #   items:
  #     - { name: torch, min: 3, max: 7, shop: General Store, at: { map: 1, room: 2147 } }
  supplies:
    items: []

  # Picking things up, unasked -- MegaMUD's auto-get.
  #
  # `coins` takes coins the moment they land (`18 gold drop to the ground.`)
  # and any a look lists. `items` is a list of names to take whenever a look
  # lists them, matched by prefix because that is how the server reads `get`.
  # Each name is asked for once per room -- a `get` the server refused is not
  # repeated on every look -- and never while resting, since anything breaks a
  # rest. Off by default, like everything automated.
  loot:
    coins: false
    # Which coins are worth bending down for. All five by default, which is
    # what `coins: true` alone has always meant.
    #
    # The cheap ones are most of what drops and least of what they are worth: a
    # lap through a lair fills the purse with copper, and every `get copper` is
    # a command out of the budget the fighting is done from. MegaMUD has one
    # Auto-Get Cash switch and no way to say which coins; this is the finer
    # control it wanted. An empty list takes none.
    coinKinds: [runic, platinum, gold, silver, copper]

    # Which coins to put back on the floor whenever any are carried.
    #
    # The other end of `coinKinds`, and the two are exclusive: a coin on both
    # lists would be picked up and dropped for ever, one command each way. A
    # coin on neither is kept -- that is the third answer the pair exists to
    # express, and it is what makes "stop collecting copper" different from
    # "throw the copper away".
    #
    # Empty here, and nothing shipped ever throws money away. A coin is only
    # ever dropped when the pack listing says how many are carried, in one
    # `drop <count> <coin>`, and never while an item in the pack answers to the
    # same word -- `drop 15 copper` would drop a copper ring instead, which is
    # the server's own matching rule and not a guess about it.
    discardKinds: []

    # What this character says about particular items -- MegaMUD's Game Item
    # Details, one row per item, for the MegaMUD engine. Each row names an
    # item and only what is chosen for it: collect, discard, equip, find,
    # open, buy, sell (or stash), cannotTake, backstab and mustHaveMin, the
    # least to keep (keep), the most to get (most), the path that gets it
    # (ifNeeded) and the shop it is bought at or sold to (shop, as the realm
    # names the shop).
    #
    #   itemDetails:
    #     - { item: healing potion, buy: true, mustHaveMin: true, keep: 5 }
    #     - { item: rusty dagger, discard: true }
    #
    # Laid one field at a time over the realm's own table
    # (servers/<id>/items.yaml, imported from Items.md on the realm's page): a
    # field left out keeps what the realm's row says. The item's weight,
    # price, type and where it is worn are the realm data's.
    itemDetails: []

  # Searching every room you arrive in, unasked. The realm hides exits -- 249
  # of the shipped realm's are Hidden/Searchable -- and the router already
  # prices one of those at "costs the search", so a route may be planned
  # through a corridor nobody has looked for. The walker searches *reactively*,
  # when a step it planned is refused; this is the other half, and it is what
  # finds the exit nothing planned a route through in the first place.
  #
  # `tries` is how many searches one room is worth (1-5). One by default: the
  # server may answer a first search with nothing and a second with an exit,
  # and nobody has measured which -- each try is a command out of the same
  # budget the fighting is done from. Never in combat, never while resting, and
  # once per room rather than once per status line. Off by default, like
  # everything automated; the toolbar's magnifier flips it mid-play.
  search:
    enabled: false
    tries: 1

  # Answering the `@` commands another player's client sends this one --
  # MegaMUD's remote control, spoken over the game's own chat channels. This
  # client calls them *remotes*.
  #
  # `/Ardren @health` telepaths a question and this client answers
  # `{HP=62/62,MA=10/10}` without anybody touching the keyboard, which is what
  # makes running several characters at once workable: the party roster costs a
  # command and gives a percentage, and this costs a telepath and gives the
  # numbers.
  #
  # Answered or acted on: @health, @version, @exp, @level, @status, @lives,
  # @where, @who, @what, @wealth, @enc, @have, @settings, @do, @join, @invite,
  # @forget, @get-all, @drop-all, @party, @wait, @ok.
  # Refused, always: @kill (this client never attacks a player), @hangup and
  # @relog and @panic! (an unclean disconnect is fatal at low health). Every
  # other `@` command is understood, reported and *not* answered -- no capture
  # shows its reply format, and inventing one would put a guess on another
  # player's screen in a shape their client cannot read.
  #
  # Off by default. `enabled` is the *switch* -- be reachable at all -- and the
  # two lists below are the *gate*. With the switch on and nothing granted,
  # nobody is answered, which is the honest starting point for a channel by
  # which somebody else's typing moves this character.
  #
  # `gangpath` is whether `gb @exp` from somebody in the gang is answered `gb
  # {Made: ...}` on the gang's own channel. Its own switch because a gangpath
  # answer is spoken to the whole gang, where a telepath, a say and a directed
  # say each address one person. Off, a gangpath `@` command is read and never
  # answered, however much is granted below.
  #
  # `gang` is what anybody in **this character's** gang may ask for. One list,
  # not one per gang: a character is in one at a time. Leave one gang for
  # another and the new one inherits the list -- the Gang card says so on every
  # draw. Membership is read from the `who` listing: this character's own row
  # and the asker's must both name the same gang, and until a listing has shown
  # both, the gang grants nobody anything. A gangpath does not prove membership
  # (this character's own `bg` comes back naming itself, and an admin can ghost
  # one), so it is deliberately not evidence.
  #
  # `party` is what anybody who has **joined this character's party** may ask
  # for, and it is the one list that ships with anything in it. The first two
  # names say nothing the party listing does not already say and do nothing to
  # this character: @health is the absolute figures behind the
  # percentage the listing shows, and @bless-expired is a member telling this
  # character their blessing ran out, which `blessings` decides about against
  # your own configuration. The third, @heal, is a member asking for one party
  # heal. Deny it by name to refuse one member.
  #
  # @where, @status, @wait and @ok were on this list and were taken off. @where
  # names the room and its exits and @status names the walk's destination and
  # the stealth flag -- neither is on the party listing, and on a realm with PvP
  # that is *where to find me*. @wait is not a fact but a stop: it pauses a
  # running loop with no deadline, released only by @ok or a reconnect, so a
  # follower who says it and logs off leaves the lap standing still all evening.
  # All four are one click away on the Party page, by name.
  #
  # Membership only -- an invitation nobody accepted is not a party, or `invite`
  # would be the gesture that hands somebody this list. The other end is
  # weaker and is written down rather than glossed: somebody typing
  # `follow <you>` lands on your party listing as a member, and whether this
  # realm honours an uninvited follow has never been asked of the wire. That is
  # why the two names above are facts about your own body rather than about
  # where you are.
  #
  # `players` is per person, keyed by name in lower case, with two lists each.
  # `deny` beats everything, which is what makes "the party, except Corwin"
  # expressible; `allow` grants whether or not they are in the gang or party;
  # anything in neither list falls through to `gang` and then to `party`.
  # `autoInviteWhenSeen: true` on a name is MegaMUD's Invite To Party If Seen:
  # they are invited when they come into your room, or you into theirs, unless
  # you follow somebody or they have already joined or been invited. With
  # `enabled` on, a telepathed @join follows the invite for a client that
  # answers one. It answers no request, so it is not a remote and works with
  # `enabled` off; it is written only when on.
  #
  #   remotes:
  #     enabled: true
  #     gangpath: true
  #     gang: [health, where, exp]
  #     party: [health, where, bless-expired]
  #     players:
  #       ardren:
  #         allow: [health, do, get-all]
  #         deny: []
  #         autoInviteWhenSeen: true
  #       corwin:
  #         allow: []
  #         deny: [do, drop-all]
  #
  # There is no ground meaning "everybody", and the absence is deliberate: it is
  # not a reason, it is the absence of a gate.
  #
  # `autoJoin` joins a party when its leader invites you, without waiting for
  # the @join the leader would telepath next. Only somebody granted @join
  # above is joined, and never while you are already in a party.
  remotes:
    enabled: false
    gangpath: false
    autoJoin: false
    gang: []
    party: [health, bless-expired, heal]
    players: {}

    # Commands of your own that other players may ask this character for -- a
    # healer's @heal for whoever asks, say. MegaMUD has none: its Messages rows
    # can answer a telepath, but they are the realm's, every character on it
    # answers, and anybody may ask. Each row is the word asked, what to send
    # and what to answer, in MegaMUD's macros ({source} is whoever asked), and
    # who may ask: the party, the gang, named players, or anyone, which you say
    # in so many words. They are answered after MegaMUD's own commands, so a
    # party member's @heal is still MegaMUD's party heal, and not at all while
    # MegaMUD's Talk tab refuses remote commands. On the Character page under
    # Talk. For example:
    #
    #   commands:
    #     - word: '@heal'
    #       send: 'mend {source}'
    #       reply: '{healing}'
    #       party: false
    #       gang: true
    #       anyone: false
    #       players: [ardren]
    commands: []

  # Loops are files now, one each, and which characters may walk one is decided
  # by *which directory it is in*:
  #
  #   global/loops/*.yaml          every character, whatever realm
  #   servers/<id>/loops/*.yaml    every character on that realm
  #   profiles/<id>/loops/*.yaml   that character alone
  #
  # A loop is a list of *places*, not recorded steps: the client plans each leg
  # itself, so a corridor that changes, a door that opens or better world data
  # is picked up for free -- and a loop is four lines anybody can write by hand.
  # Name a room as the realm spells it, with `map/room` after it when the name
  # is shared (thirteen rooms are called Town Gates). `linger` waits in a room
  # for a lair to repopulate; `bounce: true` walks a corridor there and back
  # rather than jumping from the last stop to the first.
  #
  # `every` is the room's own clock, in seconds: the lap walks that stop only
  # once that long has passed since it was last left cleared, and takes the
  # next stop whose clock has come round instead. It is what stops a lair on a
  # slow clock costing its detour on every lap -- three rooms at 30, 30 and 60
  # seconds are walked 1, 2, 3, 1, 2, 1, 2, 3 rather than 1, 2, 3 every time.
  # Measured on what actually happened, so a long fight or a rest moves it.
  # A stop with no `every` is walked every lap, which is what every loop
  # written by hand does; the Hunting card puts one on each stop of the loops
  # it builds, from the realm's own regeneration times.
  #
  # One file looks like this, and its name inside it is what the palette shows:
  #
  #   name: Newhaven arena
  #   stops:
  #     - 'Newhaven, Arena 1/2150'
  #     - { room: 'Dungeon, Entrance 1/2152', linger: 20 }
  #     - { room: 'Dungeon, Deep Cell 1/2160', every: 120 }
  #
  # 420 of MegaMUD's own are shipped in resources/loops/megamud.yaml, and the
  # settings screen offers them at each of the three scopes -- that is the easy
  # way in. A list left here is still read and still walked, laid *under* the
  # files, so an older options file keeps working; the screen writes files.
  loops: []

  # Getting your numbers back up -- MegaMUD's Health tab.
  #
  # Separate from safety: below, running away and sitting down are opposite
  # answers to the same number, and they must not be able to fire together.
  # Running away is proposed in the emergency band and this in the probe band,
  # so a character under both thresholds runs first and rests where it lands.
  #
  # Measured (`npm run probe:rest`): `rest` answers `You are now resting.` and
  # the status line becomes `[HP=34 (Resting) ]:`. Asking twice is idempotent.
  #
  # There is nothing here that stands you up, and nothing needs one. Resting
  # stops you doing nothing at all -- you can look, talk and read your pack
  # sitting down, and none of those ends it -- and the three things you cannot
  # do sitting down, moving, attacking and casting, end it themselves on the way
  # past. So the client spends no command on standing up: the next one you
  # actually wanted does it for free.
  #
  # Casting was the late addition to that list, measured 2026-09-02 and not by
  # the probe: a heal answered a `(Resting)` prompt and the flag never came
  # back. `restTo` below is what sits you down again after it.
  #
  # There was an "up at" threshold here until 2026-08-27, sending `l` on the
  # belief that any command breaks a rest. A look does not, so on reaching the
  # threshold it sent one, saw the flag still up, and sent another -- 431 of
  # them in fourteen seconds.
  #
  # Fractions of maximum, like every threshold here, so one number holds at
  # every level. 0 never does it.
  #
  # This pair also holds a running **loop** still and walks it on again. They
  # were a second pair (`loopPauseBelow` / `loopResumeAt`) until 2026-09-02, on
  # the reasoning that pausing a lap and sitting down are different questions.
  # They are not, quite: nothing rests while a loop is marching, so between a
  # pause figure and a lower resting floor the character walks while it is too
  # hurt to sit down. One pair cannot express that gap.
  health:
    restBelow: 0.35

    # Keep sitting back down until health reaches this, and 0 for a single
    # sit-down at the figure above.
    #
    # The server keeps you resting long past `restBelow` for free, so that
    # figure only describes how a rest *begins* -- and the first thing to break
    # one above it left the character standing for the whole of the recovery.
    # Casting is one of those things: measured 2026-09-02, `c swan` sent to a
    # `(Resting)` prompt and the flag gone from every prompt after it. That is
    # expensive -- the same session regenerated 2 HP every 5s sitting and 2 HP
    # every 30s standing -- so a heal bought six points at six times the price
    # of waiting and then paid it for four minutes.
    #
    # With this set you get rest, heal, rest, heal. A figure below `restBelow`
    # is lifted to it.
    #
    # It is also where a loop held for health walks on again, which is why the
    # shipped pair is 0.35/0.7 rather than the 0 every other threshold here
    # ships at: those are the figures the retired loop pair shipped with, and a
    # loop marching a 6% character through lairs that attack on sight was
    # measured live. Resting itself is still off until `automation.enabled` is
    # on, so an unconfigured client sits nobody down -- what these decide
    # unasked is only whether a lap *you started* keeps marching while its
    # character is hurt.
    restTo: 0.7

    # And the same for mana. Ignored outright for a class that has none -- a
    # warrior's status line carries no MA= at all, and `med` for one is answered
    # `Your command had no effect.` in the room.
    meditateBelow: 0

    # And how far up to meditate before a walk or a lap goes on: the mana half
    # of restTo. 0 is meditateBelow and a small margin, which is what the hold
    # did before this was a setting. Raised to meditateBelow if set under it --
    # a figure to stop at below the one to start at is two opposite
    # instructions.
    meditateTo: 0

    # Potions and anything else, with its own condition -- *use this when that
    # is true*. MegaMUD's Health tab had one row beside "Heal if below" and
    # this client had two named slots; this replaced both, because it says
    # everything they said and the things they could not -- a second healing
    # potion at a lower depth, an antidote the moment the character is
    # poisoned, a scroll read rather than drunk.
    #
    # Each row is an item name, a `when` (hp, mana, poisoned, blind, diseased,
    # held), a `below` share of maximum for the two that are measured, and
    # `drink` or `use`. Only an item the pack lists is ever asked for, and only
    # a condition the wire has *stated* fires one: unknown is not afflicted.
    #
    # Empty, like `supplies.items`, and for the same reason: spending a
    # player's consumables unasked is its own failure.
    #
    #   potions:
    #     - name: cure poison potion
    #       when: poisoned
    #       below: 0
    #       verb: drink
    potions: []
    # And the realm's own half of that list.
    #
    # Where the realm says a spell stops a room's effect and a carried item's
    # use casts it -- the waterskin against the desert spell, 945 rooms of it
    # -- the item is used before the step into such a room, and again whenever
    # the spell lapses while standing in one. The rule is the realm's, so
    # there is nothing to write here: what a realm this client does not hold
    # says nothing about, it does nothing about.
    #
    # On, for the reason the torch is: a rule cannot see the step ahead, and
    # the desert takes 13 hit points a tick from a character carrying the
    # answer. A use spends a charge, and where the server prints no countdown
    # the client's clock on the spell is its own reckoning off the realm's
    # stated duration.
    useWards: true

  # Running a quest's plan -- the Quest card's Run it (todo 102).
  #
  # Plan it draws the steps still to do to reach a step of a chain: what each
  # gathers and where, where the act happens, what is said or killed there.
  # With `enabled` on, Run it carries that plan one step at a time -- the pack
  # is read, each item is bought, hunted or asked for the way the plan says,
  # the way to the act is walked as a leg, the act is sent, and the counter is
  # read back with `abil` before the next step starts. A step that rolls is
  # asked again, a bounded number of times; a step whose counter did not move
  # stops the run and says so.
  #
  # Off, because a run walks across the realm, buys, hunts and fights for as
  # long as the chain takes, and that is a night to sign up for on purpose.
  quests:
    enabled: false

  # Going hunting on its own: where this character should be at all.
  #
  # The Hunting card ranks every lair the exits reach from where the character
  # stands, prices each one against this character's own sheet and the realm's
  # own respawn clock, sizes a loop to that clock and fills it from the lairs
  # beside it. This is the same answer, walked to without a click: with
  # `enabled` on, a character with nothing else to do -- no lap, no route, no
  # errand, nothing swinging at it -- is walked to the best spot within reach
  # and set looping round it.
  #
  # The loop is built from the survey each time and is filed nowhere, so a
  # lair that stops being worth walking is never left on a shelf under a name
  # that promises it is.
  #
  # Off, because a client that decides for itself where a character spends the
  # night is a decision worth making on purpose.
  #
  # `radius` is how far to look, in steps; 0 is everywhere the exits reach,
  # which is the right answer for "where should this character be tonight" and
  # the wrong one for a character that should not leave its area.
  #
  # There is no floor here: `walk.minExpPerHour` above is the rate below which
  # nothing is worth walking to, and the survey's own exclusions -- a lair
  # whose worst spawn would take too much of the bar, one too trivial to pay --
  # are the safety. Two names for one question is how somebody sets one and
  # wonders why the other still decides.
  hunting:
    enabled: false
    radius: 0

  # Casting -- MegaMUD's Spells tab, at its smallest useful size.
  #
  # One spell and one floor, deliberately. "Cast this when that" is what
  # `rules:` below is for, and a guard can express every condition a caster has
  # except *when*: the ~100ms after the last swing that decides whether a spell
  # lands inside the round or after it. That window is what this covers.
  #
  # Write the spell's whole name (or its abbreviation) -- readable either
  # way. What actually goes out is `<short> <target>`, the realm's own
  # short name typed as the command itself, never behind `c`: a mystic's
  # `swan` has no `c` form, and `pres` casts what `c pressure points`
  # refuses. The client resolves the name through your own spell listing
  # and the realm data at the moment of casting, and a cast on yourself
  # goes out bare, with no target -- a targetless cast lands on the caster.
  spells:
    # Auto Choose Best Spell.
    #
    # On, the round spell is worked out every round from the spellbook the
    # client has read and the realm's own figures, the way a player who knows
    # their spells would: a spell the monster resists is not cast (a lightning
    # bolt at something that resists lightning is mana thrown away), the
    # cheapest spell whose *least* roll would finish what is left of the
    # monster is cast when there is one, and otherwise the hardest hitter the
    # pool can pay for. The cures below come from the book the same way where
    # their boxes are blank. The choice is said out loud each time it changes.
    # `attack` is what is cast with this off. Off:
    # it spends mana on a reading you did not type.
    autoChoose: false

    attack: ''

    # The spell for a crowded room -- MegaMUD's MultAttack. When at least
    # `areaMinMobs` threats stand in the room -- what is in this fight or
    # would join it, never a shopkeeper -- and mana is at or above
    # `minMana`, this is cast instead
    # of `attack`: bare, with no target, which is how the wire shows an area
    # spell cast (`You cast poison cloud on the room!`). Never while a
    # monster the realm calls good stands in the room: a room spell hits
    # everything, and the ten evil points are a cost no setting spends
    # unasked. Blank casts nothing.
    areaAttack: ''
    areaMinMobs: 3

    # How many times the round spell is cast per target,
    # and the same for the area spell -- MegaMUD's MaxCastCnt / MultCastCnt.
    # 0 is no limit. MegaMUD's own default is 1: open with the spell, then let
    # the melee round carry the fight, which is what a caster with a small
    # pool wants for a night's grinding. Counted on the server's confirmation
    # (a cast that fizzles is not one), and a new target starts the count
    # again.
    attackCasts: 0
    areaCasts: 0

    # Heal if below -- MegaMUD's Health tab, kept beside the attack spell
    # because it is the same mechanism: one cast, chosen by a number, under
    # the same `minMana` floor.
    #
    # Two spells, because the realm distinguishes them. `Spells.Targets` marks
    # `way of the swan` castable on the caster alone and `minor healing`
    # castable on anybody, so `heal` is what this character casts on itself
    # (bare -- a targetless cast lands on the caster) and `healPartyWith` is
    # what it casts on a member (`c <short> <name>`, or bare for a party-wide
    # spell like `healing rain`, which reaches everyone and takes no name).
    # The settings screen's pickers offer each field only what the realm says
    # it may cast; a field left blank heals nobody.
    #
    # `healBelow` starts the healing and `healTo` stops it. 0.5 and 0.9 means
    # begin at half health and keep casting on that target until it is back to
    # 90% -- the hysteresis `restBelow`/`restTo` uses, and for the
    # same reason: one cast at 50% that lands at 55% leaves a character
    # hovering under the line, re-casting one spell at a time and never
    # getting ahead of the damage. `healTo: 0` is a single cast at the
    # threshold. A `healTo` below `healBelow` is two opposite instructions and
    # is raised to it rather than obeyed.
    #
    # A party member's health arrives as a percentage and needs no maximum, so
    # one pair of figures serves both. An unknown number never heals: a member
    # not yet listed has none, and a guess is not a reason to spend a cast.
    heal: ''
    healPartyWith: ''
    healBelow: 0
    healTo: 0

    # A different floor while in combat, when one is wanted -- MegaMUD's
    # `HpHealAtt%`, whose own documentation says why: "this percentage should
    # normally be set low to help in extreme danger conditions only, so that
    # combat is not normally affected". A heal cast at 80% mid-fight is a round
    # spent not hitting anything, and the round is what the fight is made of.
    #
    # 0 uses `healBelow` for both, which is what this client did before the
    # field existed. Deliberately not clamped against it: a player who wants to
    # heal more readily in a fight than out of one is entitled to say so.
    healBelowInCombat: 0

    # Do not cast below this fraction of maximum mana. 0 always casts.
    #
    # The setting MegaMUD's own documentation warns about most: set too high and
    # the character silently never casts, and reads as broken.
    minMana: 0.15

    # Curative spells, one per condition the client can see -- each is a pair
    # of sentences in the capture corpus, on and off: `You are blind.` /
    # `You can see again!`, `You are dizzy and disoriented from poison!` /
    # `The dizzying poison runs its course.`, `You are inflicted with a hideous
    # rotting disease!` / `The disease dies down.`. Cast bare once per onset
    # (a targetless cast lands on you), again after thirty seconds if the condition is still
    # stated. Blank casts nothing. `freedom` is MegaMUD's Freedom: cast when
    # the character cannot move (`Your legs are paralyzed!`, a net, webbing,
    # or anything a realm's message table says holds it).
    cures:
      blindness: ''
      poison: ''
      disease: ''
      freedom: ''

    # MegaMUD's regen and when-full spells, timed as megamud.exe times them.
    # `hp` is cast before a rest while health is short, with at least minMana
    # left; the rest follows on the next line. It is not cast again while a
    # row of the realm's message table says it is still working, or, where the
    # realm never says it ended, until health and mana have both been full.
    # `hpFull` and `manaFull` are cast once each time health reaches restTo and
    # mana reaches meditateTo. Blank casts nothing.
    regen:
      hp: ''
      hpFull: ''
      manaFull: ''

    # Blessings kept up on this character and the party, in priority order --
    # the first entry is recast first when several are down. The spell names
    # the row: the whole name, resolved to the realm's short word when it is
    # cast. Event-driven where the wire
    # allows: the cast confirmation establishes a buff and the wear-off
    # sentence (`The effects of bless wear off!`) recasts it the moment it
    # ends. For endings the wire never states, a self blessing falls back to
    # the duration the client has measured from your own earlier casts; a
    # party blessing recasts on `fallbackSeconds` (floored at 30), because
    # its wear-off prints on the member's screen, not yours. `target` is
    # `self` or `party`; `inCombat` allows the recast mid-fight (defaults on
    # for self, off for party); `prioritizeOverHeal` recasts it ahead of the
    # heal when both are due. For example:
    #
    #   blessings:
    #     - spell: protection
    #       target: self
    #       minMana: 0.3
    #     - spell: bless
    #       target: party
    #       fallbackSeconds: 600
    blessings: []

    # Whether the blessings above are cast unasked at all. The toolbar's
    # Auto-Bless switch: turn it off to keep the mana for healing through a
    # fight and back on after, without emptying the list. Off, nothing here is
    # cast for you; the cures and the heal are untouched.
    autoBless: true

  # Fighting for you, rather than keeping you alive.
  #
  # The thing MegaMUD was actually for, and the last part of this client you
  # still had to do by hand. Off, like everything automated: a client that
  # starts swinging at things the first time you open it is a client picking
  # your fights.
  #
  # Running away outranks fighting and that is not configurable. The retreat is
  # proposed in the emergency band and this in the combat band, and nothing here
  # opens a fight while an escape is in flight -- a client that ran from a room and
  # swung on the way out would have spent the escape and stayed in the fight.
  combat:
    enabled: false

    # Leave alone a monster somebody outside your party is already fighting --
    # MegaMUD's PoliteAttacks, under its own name and in its own direction. On,
    # a monster a stranger was seen swinging at in the last minute is left to
    # them and the trace says whose it was: stealing a kill is rude everywhere
    # and on a PvP realm it is an invitation. Off (MegaMUD's own default, and
    # this client's) joins. A party member's fight is never a claim -- joining
    # that is assisting, under `party:`.
    politeAttacks: false

    # Do not open a fight when more than this many monsters are here.
    # 0 never refuses. MegaMUD calls this Max Monsters, and it is the cheapest
    # place to decline being swarmed: a health threshold notices too late.
    maxMobs: 0

    # The realm's own words, from docs/greatermud/commands.md. `a` attacks,
    # `bash` is all-out, `bs` backstabs, `sm` smashes, and `pu`, `kic` and `ju`
    # are the mystic's punch, kick and jumpkick.
    #
    # A verb this character cannot use is dropped the first time the realm says
    # so -- `You don't know the first thing about bashing!` -- and said once in
    # the terminal. That refusal is printed in the room, so a client that kept
    # sending it would keep announcing it.
    attack: a

    # Sent instead of `attack` for the first blow of a fight, and only the
    # first: spending it is the point of having it. `bs` for a thief, `ju` for a
    # mystic. Blank for none.
    opener: ''

    # How named monsters are treated -- MegaMUD's Monster Details, one row per
    # monster. A row names a monster and only what differs from one nobody
    # listed:
    #
    #   relationship  friend (never attacked, even when it swings first), avoid
    #                 (never started on, hit back), enemy (the default), escape
    #                 (run from), hangup (end the session when it is here)
    #   priority      first, high, default, low, last -- the order the rest are
    #                 attacked in
    #   notHostile, noBackstab, stopToKill, and a preAttack or attack spell
    #
    #   monsters:
    #     - { mob: town guard, relationship: friend }
    #     - { mob: gnoll shaman, priority: first }
    #     - { mob: gigantic black ooze, attack: mmis }
    #
    # Where a monster with a priority is in the room the band decides outright
    # and the client's own weighing is skipped -- which is the point: a ranking
    # the realm's arithmetic could overturn is one nobody can predict from
    # reading it. Every refusal still applies first, so a band says which of
    # the monsters worth attacking to attack, never that one is.
    #
    # Laid one field at a time: the realm's own table (servers/<id>/monsters.yaml,
    # imported from Monsters.md on the realm's page) under this list, and this
    # list under a character's own rows. A field left out keeps what the broader
    # one says.
    monsters: []

    # And two more of MegaMUD's, off its Combat page. `minMobs` is the mirror
    # of `maxMobs` above -- do not open unless at least this many are here,
    # which is for a character whose whole value is an area spell: opening on
    # one monster spends the round and the mana for a fraction of what the
    # spell is for. `maxMonsterExperience` is MegaMUD's own difficulty cap
    # (`MaxMstrExp`): skip anything the realm says is worth more than this.
    # Both 0 never refuse.
    minMobs: 0
    maxMonsterExperience: 0

  # Following somebody: what this character does about the party it travels in.
  #
  # All off, and with one more reason than usual. Whether the server's command
  # window is per connection or per host is UNMEASURED (docs/profiles.md §9.2):
  # it was measured with one socket, and if it is per host, several automated
  # characters starve each other in a way nothing can see. These are what make
  # a second automated character useful; turning them on is choosing to run
  # that experiment.
  party:
    # Swing at a monster seen attacking any party member -- MegaMUD's
    # DefendParty. The fight came to the party, and every combat gate still
    # applies. Never a player on either end: a
    # person attacking a member is that member's PvP fight.
    defendParty: false

    # Say @heal in the room when health falls below this share of maximum while
    # in a party -- MegaMUD's Ask For Healing. A member running MegaMUD or this
    # client answers with a heal. Said on the crossing and again every
    # tuning.remotes.healAskAgainMs while still under it. 0 never asks.
    askForHealBelow: 0

    # Leading, pause the loop while any member's health on the party listing is
    # under this share, as a @wait would -- MegaMUD's Wait For Party Members. How
    # fresh that figure is depends on parEverySeconds below. Ignored while
    # following. 0 never waits.
    waitForMembersBelow: 0

    # Leading, the most minutes to pause for the party -- a @wait whose @ok
    # never came, or a member whose health never rose -- before walking on:
    # MegaMUD's If Leading Wait No Longer Than. 0 waits as long as it takes.
    waitNoLongerMinutes: 0

    # Leading, walk on through a follower's @wait -- MegaMUD's Ignore @wait If
    # Leading. waitForMembersBelow still pauses the loop for a member's health.
    ignoreWaitWhenLeading: false

    # Following, refuse the leader's @party <command> -- MegaMUD's Ignore @party
    # If Following, for a leader trusted to help but not to type for you.
    ignorePartyWhenFollowing: false

    # Telepath @health to whoever joins, for their real health and mana rather
    # than the listing's percentage -- MegaMUD's Request Party Health.
    requestPartyHealth: true

    # Ask for the party listing every this many seconds in a fight, and twice
    # that out of one, while in a party -- MegaMUD's Par Frequency (15 there).
    # 0 asks only when the party changes. Never under 5.
    parEverySeconds: 0

    # And after every combat round -- MegaMUD's Send PAR after combat round.
    parAfterRound: false

  # Keeping a character alive, rather than playing it.
  safety:
    # Running away.
    #
    # The escape that actually works: walking out breaks combat and carries
    # none of the penalty an unclean disconnect does -- which is why hangUp
    # below tells you to do this instead.
    #
    # THERE IS NO `flee` COMMAND. Not on GreaterMUD, not on the derivatives.
    # It is not one of the 94 commands in the server's own dispatch table, and
    # the wire agrees: this client sent it eleven times in seventy seconds on
    # 2026-09-02 and every one came back `Your command had no effect.` while
    # the character was beaten from 70 HP to death in a room it had walked
    # into itself a minute earlier. So the escape is always a DIRECTION, and
    # if there is no direction to send, nothing is sent and it says so.
    #
    # Only while something is taking the character somewhere: a route, a loop,
    # an errand, a quest run. Once a route has arrived, the character stays
    # where it is and says so: the room it arrived in is the one you asked for.
    #
    # Off, like everything automated: a client that starts running away on its
    # own the first time you open it is a client deciding when a fight is lost,
    # and that is your call until you say otherwise.
    retreat:
      enabled: false

      # Fraction of maximum health below which you run.
      belowHealth: 0.3

    # Hanging up to escape.
    #
    # READ THIS BEFORE TURNING IT ON. Every MegaMUD-era client offers
    # "disconnect when health is low". On this server family that is one of the
    # more reliable ways to *die*: an unclean disconnect costs a percentage of
    # your MAXIMUM health -- which at low health kills you, and is recorded as a
    # disconnect penalty -- or drops random items.
    #
    # Five conditions make a disconnect unclean, and they are exactly the ones
    # that co-occur with wanting to press the button:
    #
    #   - you are in PvP combat
    #   - somebody in the room is targeting you in PvP
    #   - a player attacked you in the last five minutes
    #   - you attacked a player in the last five minutes
    #   - a mob in the room is targeting you
    #
    # The five-minute window is the part nothing on screen shows. Combat has
    # ended, the room is empty, and a hangup is still penalised.
    #
    # A second way out, for a realm that answers `sys status` (see `locate` on
    # the realm): there `sys goto <place>` is a real command that moves the
    # character in one round, so it is its own, more desperate rung -- below
    # retreat's belowHealth and above hangUp's. The fight is broken off the
    # way a retreat breaks it; once it is over, this sends `sys goto` to
    # `destination` instead of walking. Empty `destination` never sends it.
    # A character following a leader never flees, nor retreats: it stays with
    # the party, and the leader decides.
    fleeGoto:
      enabled: false
      belowHealth: 0.2
      destination: ''

    # Walking out is the escape that works. Hanging up is the escape that
    # works afterwards. See docs/greatermud/combat.md.
    hangUp:
      enabled: false

      # Fraction of maximum health below which hanging up is considered.
      belowHealth: 0.15

  # Pacing, from measurement rather than taste. The server accepts about twenty
  # commands in flight and then silently discards the rest -- no complaint, no
  # disconnect, no way to tell. See docs/legacy-assessment.md 6.2.
  #
  # Your typing needs no setting here. While you have a half-typed command,
  # automation holds everything until you press Enter (or erase the line), and
  # then sends immediately after -- the server would otherwise glue its
  # command onto your half-typed one and say the result out loud in the room.
  # The one exception is an emergency: an escape presses Enter on your
  # half-typed line first, then goes, because a move that waits for you to
  # finish a word is a move that arrives after the fight.
  pacing:
    # Commands allowed on the wire without an acknowledging status line.
    # Capped at 10: a config cannot opt into losing commands undetectably.
    window: 3
    minGapMs: 350
    # Give up waiting for a prompt after this. Not every command produces one.
    ackTimeoutMs: 3000

logging:
  # Append the decoded session to a file: what happened forty seconds ago, after
  # the terminal's backscroll is gone. ANSI is stripped so the log is greppable;
  # a fresh file is started per connection.
  enabled: true

  # Write down every fight: what it cost, and the conditions it was fought
  # under -- level, class, race, maxima, alignment, what was worn and wielded,
  # the room, and how many other monsters were in it.
  #
  # Nothing reads these yet, which is the point of collecting them: every
  # question worth asking about how a character fights needs a record that
  # predates the question, and a client that starts collecting on the day
  # somebody asks has to wait a month for an answer.
  #
  # One small compressed file per character beside this one, in `fights/`.
  # Appended, never revised, so it is safe to read while the client is running
  # and a crash costs the last couple of seconds rather than the file. On,
  # unlike the capture above: a record is a few hundred bytes and holds no text
  # the server sent, so it cannot hold a password.
  fights: true

  # Also record a full machine-readable capture: raw bytes, decoded text with
  # escape sequences intact, framed lines and outbound commands, timestamped.
  # Play manually with this on, then `npm run capture:analyse -- <file>` to see
  # exactly what the parser does not yet understand.
  #
  # On by default, and it was not always. It was off because it is verbose,
  # which was the wrong trade: the first real disagreement about what the
  # server actually sent, and in what order, had no file to settle it from.
  # A recording you have to remember to switch on is never on when it matters,
  # because by then the thing you wanted recorded has already happened.
  #
  # One file per session, beside the other logs, gitignored. `raw` records the
  # bytes off the socket before decoding, so an encoding or ordering fault is
  # reproducible from the file alone.
  capture: true

  # Keep the Talk card's conversation history on disk, so quitting and
  # restarting restores it rather than starting the card empty. One plain
  # file per character, in `talk/`, holding only the conversation channels --
  # gossip, broadcast, telepaths, says -- never a prompt, so it cannot hold a
  # password. `conversationDays` is the cleanup: anything older is dropped
  # when the log is opened, and a year is the default.
  conversations: true
  conversationDays: 365

  # Empty means <userData>/logs. "Reveal session logs" in the command palette
  # opens whichever is in force.
  directory: ''

  # A session log, a capture or a fight log goes on in a new file past this
  # size, so a long session is recorded to its end. 64 MiB.
  maxBytes: 67108864

  # What the logs folder may hold in all. Past it the oldest logs and
  # captures are deleted, never one a session is still writing, so a client
  # left running for weeks cannot fill the disk. 2 GiB.
  keepBytes: 2147483648

  # Post this character's readings to its realm's mudstats board -- the realm's
  # `statsUrl:` -- every `everySeconds`: a whole snapshot each time (health,
  # experience and its rate as the Combat Stats card shows them, since its
  # Reset or the lap begun, the room, the pack, what it is doing), never
  # sooner than the board allows. Link the character first, on its Login page:
  # the board telepaths it a code, the client reads it off the telepath, and
  # the key the board gives is kept beside the character's password.
  #
  # Off by default, because posting tells the board to stop asking the
  # character by telepath: this client becomes its only source there, and
  # nothing is posted while it is out of the game.
  stats:
    enabled: false
    everySeconds: 60
