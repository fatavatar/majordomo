    asking: 'Going to {room}, {steps} steps away, to say "{say}" for {item}.'
    askingHere: 'Saying "{say}" here in {room} for {item}.'
    # What the answer takes, fetched before it is asked (format 53).
    takesFirst: '"{say}" in {room} takes {needs} for {item}; fetching that first.'
    refusalTakesItself: 'Not collecting {item}: "{say}" takes {needs}, which comes only by way of {item} itself.'
