  effects:
    actionFailed: Last action failed
    blind: Blinded
    confused: Confused
    diseased: Diseased
    endsCombat: Ends combat
    held: Movement prevented
    hpRegen: HP regenerating
    losingHp: Losing HP
    manaRegen: Mana regenerating
    noAttack: Attack prevented
    poisoned: Poisoned
# Play was pressed on a movement that was stopped a long time and a long way
# ago. A stop keeps its place, so the lap you stopped at ten o'clock is still
# there at midnight -- after the character has been walked to a bank, killed,
# and reborn in a temple two maps away. Past `tuning.walk.resumeAskSteps` the
# client asks rather than walking it back across the realm unasked. Both
# figures are the same measurement -- how much *further* away the character is
# now than when the movement stopped -- so a movement stopped and started again
# from the same room asks nothing, however long it still had to go.
monsters:
  relationships:
    avoid: Avoid
    enemy: Enemy
    escape: Flee
    friend: Friend
    hangup: Hang up
mudstats:
  link:
    noBoard: This character's realm names no stats board.
    busy: A link is already waiting for its code.
    notInGame: The character has to be in the game to read the board's code.
    notConnected: That character is not open.
    refused: 'The stats board refused: {detail}'
    waiting: Asked the stats board for a code; waiting for its telepath to {player}…
    noCode: No code reached the character before it expired. Link again to ask for another.
    linked: Linked to the stats board as {player}.
  unlink:
    none: This character has no stats key.
    done: The stats key was retired at the board and forgotten here.
    forgottenOnly: 'Forgotten here; the board did not retire it: {detail}'
  status:
    noBoard: This character's realm names no stats board.
    notLinked: Not linked to the stats board.
    refused: 'The stats board did not recognise the key: {detail}'
    posting: posting
    off: not posting
    linked: Linked as {player} — {posts} posts so far, {state}.
  post:
    back: The stats board is answering again.
    keyRefused: 'The stats board refused this character''s key, so posting has stopped. Link it again. ({detail})'
    switchedOff: 'The stats board does not take posts for this character, so posting has stopped. ({detail})'
    rejected: 'The stats board rejected a post, so posting has stopped. ({detail})'
