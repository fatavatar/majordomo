# What the automations say: loops, login, peers, hang-up.
automation:
  # Going and getting what a route needs -- `ItemErrand` (todo 07). The route
  # says what the door wants; the realm says where it comes from.
  collect:
    abandoned: 'Gave up collecting {item}: {why}'
    becauseDoor: 'the way needs {item}'
    buying: 'Going to buy {item} at {shop} in {room} first — {detour} steps off the way.'
    buyingOnTheWay: 'Going to buy {item} at {shop} in {room} first; the way there goes past it.'
    gotAndKept: '{item} is in the pack, and it is on the keep list, so it stays.'
    gotForTheDoor: '{item} is in the pack — collected for this door, not kept.'
    hunting: 'Looking for {item}: {mob} drops it, starting at {room}, {steps} steps away.'
    huntingHere: 'Looking for {item}: {mob} drops it, starting here in {room}.'
    huntingNextDoor: 'Looking for {item}: {mob} drops it, starting next door in {room}.'
    loopName: 'Collect: {item}'
    # The MegaMUD engine's purchase for an errand, which is ours (2026-10-14).
    megaNotBought: 'Did not buy {item} at {shop}: {why}'
    whyNotSold: '{shop} sold nothing for the last buy'
    # The cash a purchase needs, drawn first where the purse is short (2026-10-18).
    cashFirst: 'Withdrawing {amount} from {bank} first, to buy {item}.'
    whyNotPaid: '{bank} paid nothing out for the withdrawal'
    whyNoBalance: '{bank} did not say its balance'
    whyVaultShort: '{bank} holds {held}, short of the {amount} wanted'
    refusalNoVault: 'Not enough on hand for {item}: {short} short, and no bank can be reached.'
    refusalVaultsShort:
      'Not enough on hand for {item}: {short} short, and no bank the record knows holds that much.'
    # The Explorer's Buy and Buy + Wear (2026-10-18).
    buyingIt: 'Going to buy {item} at {shop} in {room}, for {price}.'
    boughtIt: 'Bought {item} at {shop}.'
    refusalNoCounter: 'Nowhere this character can reach sells {item}.'
    wearingIt: 'Bought {item}; putting it on.'
    wearingInstead: 'Bought {item}; taking off {removed} and putting it on.'
    refusalBusy: Something is already being collected.
    replacingLap: 'Stopping {loopName} to go and collect it; it will not start again on its own.'
    refusalLapStopped: 'The hunt for {item} stopped before the pack held one.'
