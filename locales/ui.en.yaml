# Every word the client's chrome shows, in one place.
#
# Components look these up with t('section.key') — see src/shared/i18n.ts.
# The rules for the words themselves are docs/terminology.md: labels of at
# most four words, one-sentence tooltips, the realm's own vocabulary for
# anything the realm names, MegaMUD's words where a player already has them,
# and one word per thing (a synonym is a bug).
#
# {name} is a placeholder the code fills in at render time. Some strings are
# asserted verbatim by scripts/smoke.mjs — check before rewording.
#
# src/shared/__tests__/i18n-coverage.test.ts fails the build for a key used
# in code but absent here, and for a key here that nothing reads.
# The client itself: window title, the error boundary, running twice.
app:
  supplies:
    invalidList: The supplies list sent was not one this client could read, so nothing was written.
  automation:
    unknownSwitch: Unrecognized automation switch.
  config:
    reloadFailed: Options not reloaded — {error}
    internalTemplateAdded: 'Added to internal.yaml, from the template: {added}.'
    templateAdded: 'Added to your options file, from the template: {added}.'
    templateReconcileFailed: Options file left alone — {error}
  debug:
    noSession: There is no session to write a report for.
    realmUnknown: (not dialled)
    reportTitle: mudengine debug report
  gpu:
    softwareCompositing: 'The window is not drawn by the GPU (compositing {compositing}, rasterization {rasterization}, WebGL {webgl}): every frame is composed in software, which is why typing and scrolling crawl. Check the graphics driver, or how the client was launched.'
  connect:
    invalidTarget: Invalid connection target.
    noCharacterFile: 'Connection failed: Character "{id}" has no realm configured.'
  crash:
    guardNotice: 'Client error encountered. Background sessions remain connected: {message}'
  dialog:
    allFilesFilter: All files
    chooseRealmTitle: Choose a realm database
    realmDatabaseFilter: Realm database
  errorBoundary:
    body: Active character sessions are unaffected. Reload to restore interface.
    heading: UI Rendering Error
    reload: Reload window
  instance:
    alreadyRunning: This profile is already running. Switched to existing window.
    homeHeld: '{home} is already in use by another mudengine (pid {pid}). Two clients on one home
      write the same files and dial the same characters; stop the other one first, or delete
      {file} if it is not running.'
    staleLock: The lock left by pid {pid}, which is no longer running, was taken over.
  loop:
    invalidName: Invalid path/loop name.
    invalidLoop: Invalid loop definition.
    invalidPicks: The loop builder sent something that is not a list of at most {max} rooms.
    noLoopsSent: Nothing sent was a MegaMUD loop, so this realm's loops were left as they were.
    noneFit: None of the {count} loops fit this realm's map, so nothing was added. Choose the
      MegaMUD folder recorded on this realm.
    notFound: No loop named {name} in this character's options.
    unknownScope: Invalid loop scope.
  onboarding:
    noCharactersYet:
      No characters configured, so the settings screen is open on a new one. Ctrl/⌘ , reopens it; nothing
      connects until a character exists.
  profiles:
    fileGoneStillConnected:
      The file for "{id}" is gone, but the character is still connected. Disconnect to
      close it.
    incompleteDraft: 'Character configuration incomplete: Realm is required.'
    invalidId: A character’s file name may only use letters, numbers, - and _.
    loadFailed: Character not loaded — {error}
    noSuchCharacter: No such character.
    stillConnected: '{name} is still connected.'
  megamud:
    invalidSettings: Those MegaMUD settings could not be read.
  # MMUD Explorer's lists, which read the realm's own database file.
  explorer:
    noDatabase: This realm names no database file to read, so the Explorer has nothing to show.
    noSuchItem: The realm has no such item.
    notWorn: '{item} is not something to wear.'
    unreadable: 'The realm''s database could not be read: {reason}'
    unsupported: The Explorer computes stock MajorMUD only, and this realm's database is GreaterMUD.
  quit:
    cancelButton: Cancel
    confirmButton: Quit and disconnect
    consequenceDetail:
      Quitting disconnects them. On a PvP realm an unclean disconnect can cost items,
      or the character.
    dialogTitle: Quit mudengine
    whoIsConnected:
      many: '{count} characters are still in the realm: {names}.'
      one: '{name} is still in the realm.'
  remotes:
    invalidName: Unrecognized remote (@) command.
  route:
    invalidPayload: Invalid route path.
    noRealmData: No realm data loaded
    unknownRoom: Current room unknown. Move or look to locate character.
  messages:
    nothingRead:
      That file has no MegaMUD messages in it, so the realm's table was left as it was. Choose
      the Messages.md from a MegaMUD data folder.
    unreadable: The file could not be read.
  items:
    noRows: There were no item rows to import, so the realm's table was left as it was.
  monsters:
    noRows: There were no monster rows to import, so the realm's table was left as it was.
  servers:
    invalidDraft: A realm needs a name, a host and a port between 1 and 65535.
    noSuchServer: No such realm.
  session:
    notConnected: Not connected.
  settings:
    invalidGlobalDraft: Invalid settings payload.
  window:
    createFailed: Could not open a window.
    noMainWindow: There is no main window to move it to.
    noSecondWindow: This client is running in a browser tab, which has no second window to move a
      character into.
    nothingToGather: Nothing to gather.
    onlyCharacterHere: That is the only character in this window.
    unknownCaller: Unknown calling window.
  home:
    outside: That path is outside the client's home directory, so it was not listed.
    unreadable: '{path} could not be listed: {message}'
  clipboard:
    none: This host has no clipboard of its own; the window keeps one instead.
  windowTitle: mudengine
