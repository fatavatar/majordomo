      in {count} file(s): every question they answered is a row, and two ways of asking one
      question is how one of them comes to look broken. Your settings were carried over — a muted
      channel is a row that does not alert, a watched word an item row, a muted notification a row
      that still shows. {fileList}'
    alertFloorDropped:
      '"ui.alerts.minimum" was removed from {count} file(s): a level is a property of a line rather
      than of a channel, so no row says what a floor said and none was invented for it. Everything
      is shown again unless one of your own rows says otherwise — the Alerts section in settings is
      where they are. {fileList}'
    desktopSwitchesBecameRows:
      '"ui.alerts.desktop" was removed from {count} file(s): its two switches are questions each
      alert row already answers — "Notify" says whether a row raises one outside the window, and
      "Even when MudEngine is in front" says whether that holds while you are looking. Set them per
      row in the Alerts section of settings. {fileList}'
    desktopSwitchesSilenced:
      'Notifications were switched off altogether in {count} file(s), so every alert row there has
      "Notify" turned off to keep the same silence. Turn it back on for the rows worth being
      interrupted for. {fileList}'
    darkConsoleStated:
      '"ui.console" was written into {file}, on: under a light theme the console keeps a dark
      palette, because a light one has to make the realm''s black its paper. Choose which dark
      palette, or turn it off, there or on the MudEngine page in settings.'
    consolePaletteStated:
      '"ui.console.palette" was written into {file} as "theme", which is the console you already
