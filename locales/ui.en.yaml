  # Hunting on its own -- `AutoHunt` (todo 05). Every sentence names a figure:
  # what it is going to, what it expects to earn there, or why it will not.
  hunt:
    becauseBetter: 'this lair is paying {here} an hour and another is worth about {rate}'
