    ok: A stats board answered; it takes a post at most every {seconds} seconds.
movement:
  # The back button, when the previous room is not one step away: a one-way
  # exit, a door that shut, a corridor that only runs the other way.
  backNotAStep: 'The room you came from is {stepCount} steps away — there is no single step back to
    {destination}.'
  backTitle: 'Going back is a journey for {name}'
  stay: Stay here
  title: '{name} has wandered a long way'
  walkIt: Walk it back
  wanderedFromLoop: '{loopName} is {stepCount} steps further away than when the lap stopped.'
  wanderedFromRoute: '{destination} is {stepCount} steps further away than when the route stopped.'
  whatHappens: 'Walking it back is a journey like any other: through whatever lives on the way, with
    auto-combat and the rest deciding as they always do. Staying here changes nothing — the
    movement keeps its place, and play is there to press again.'

# The client thinks the character in the realm is not the one its records are
# about, and is asking. It only ever asks: deleting the only copy of what
# somebody learned is not a decision taken from a heuristic.
reset:
  class: Class
  exp: Experience
  forget: Forget the old character
  keep: Keep everything
  level: Level
  noticed: 'This does not look like the same character: {signals}.'
  nowHeading: Now
  race: Race
  signal:
    class: the class changed
    experience: the experience dropped sharply
    level: the level went back to 1
    race: the race changed
  title: Is {name} still the same character?
  wasHeading: 'Kept since {at}'
  whatGoes:
    'Forgetting throws away what this client kept about the character — the bank balances, the worn
    slots, the spellbook, the measured spell durations and the quest counters. What it learned about
    the realm itself stays: the map, the shops and the other players did not change.'

# How a sighting of another player is phrased, shared by the people cards.
players:
  sighting:
    daysAgo: '{days}d ago'
    hoursAgo: '{hours}h ago'
    justNow: just now
    minutesAgo: '{minutes}m ago'
    secondsAgo: '{seconds}s ago'
    noRoom: not seen in a room
    roomNumber: room {roomNumber}
    unplacedRoom: a room the client could not place
# The @ command permission grid, shared by the Player flyout, the Gang card and
# the settings screen. The command names themselves are closed-union vocabulary
# rendered as itself (`@health`) and stay in code, like every other union here.
remotes:
  allow: Allow
  allowAll: Allow all
  allowAllTitle: Grant every @ command this client can actually answer
  allowTitle: Answer @{remote} for {name}
  clearAll: Clear all
  clearAllTitle: Take every @ command back off, allowed and denied alike
  deny: Deny
  denyTitle: Never answer @{remote} for {name}, whatever the gang or the party grants
  findPlaceholder: Find an @ command
  fromGang: from the gang
  fromParty: from the party
  granted: '{granted} of {total} granted'
  noMatch: No @ command matches “{query}”.
  on: 'On'
  onPartyTitle: Let anybody who has joined this party ask for @{remote}
  onTitle: Let anybody in the gang ask for @{remote}
  showAll: Show all
  showing: '{shown} of {total}'
  support:
    refused: always refused
    refusedTitle: Refused for everybody, however granted — this client declines it on its own account.
    unread: no captured reply
    unreadTitle: '{because}'
# Serving the window over HTTP (MUDENGINE_WEB=1): the sign-in page main draws,
